fix_seed: 0
checkpoints_every: 128
tensorboard_log: True
result_path: ./results/xxx

resume:
  enable: True
  resume_path: path/to/checkpoints.pth
  restart_optimizer: True

encoder:
  random: False
  model_name:  facebook/esm2_t33_650M_UR50D # facebook/esm2_t33_650M_UR50D, facebook/esm2_t30_150M_UR50D, facebook/esm2_t12_35M_UR50D, facebook/esm2_t6_8M_UR50D
  max_len: 512
  tune_embedding: False
  adapter_h:
    enable: True
    num_end_adapter_layers: [10,4]
    module_type: "MLP1"
    freeze_adapter_layers: [True,False]
  fine_tune:
    enable: False
    last_layers_trainable: 2
  lora:
    enable: False
    r: 8
    lora_alpha: 32
    lora_dropout: 0.05
  task: ddt
  num_classes: 1
  # ── site-aware MLP head (new) ──
  head_hidden_dim: 512
  head_dropout: 0.2

train_settings:
  train_csv_path: /scratch/bcnr/yjiang12/DPLM_data/ddg/S8754.csv  # default; override with --train_csv_path
  num_epochs: 30
  shuffle: True
  loss: huber             # huber | mae | mse  (huber is MAE-friendly + robust)
  huber_beta: 0.5         # smooth_l1 transition point (in ddG units, kcal/mol)
  augment_inverse: True   # add (MT→WT, −ddG) to the TRAIN split only
  sample_weight: False
  mixed_precision: bf16   # no, fp16, bf16, fp8
  device: cuda
  batch_size: 32
  num_workers: 0
  grad_accumulation: 1

valid_settings:
  do_every: 1
  batch_size: 16
  device: cuda
  num_workers: 0

test_settings:
  test_csv_path: /scratch/bcnr/yjiang12/DPLM_data/ddg/S669.csv  # default; override with --test_csv_path
  batch_size: 16
  device: cuda
  num_workers: 0

optimizer:
  name: adam
  lr: 3e-5
  weight_decouple: True
  weight_decay: 0.005
  eps: 1e-16
  beta_1: 0.9
  beta_2: 0.999
  use_8bit_adam: False
  grad_clip_norm: 1
  head_lr_multiplier: 1.0   # >1 gives the fresh MLP head a larger LR than the adapters
  decay:
    warmup: 300
    min_lr: 1e-6
    gamma: 1
    num_restarts: 1
    first_cycle_steps: null # null or an integer number (ignore num_restarts)
